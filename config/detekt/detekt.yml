config:
  validation: true
  excludes: 'devatlas'

devatlas:
  active: true
  ColorOutsideDesignSystem:
    active: true
    excludes: ['**/designsystem/src/**', '**/test/**', '**/*Test/**']
  DpLiteralOutsideDesignSystem:
    active: true
    excludes: ['**/designsystem/src/**', '**/test/**', '**/*Test/**']
  Material3OutsideDesignSystem:
    active: true
    excludes: ['**/designsystem/src/**']

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable', 'Immutable']
  TooManyFunctions:
    ignorePrivate: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/designsystem/src/**', '**/test/**', '**/*Test/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 140
    excludes: ['**/designsystem/icon/AtlasIcons.kt']
  WildcardImport:
    active: true
