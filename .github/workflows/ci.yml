name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Detekt
        run: ./gradlew detekt --console=plain

      - name: Unit tests
        run: ./gradlew :detekt-rules:test :shared:testAndroidHostTest --console=plain

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: devatlas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
