<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="currentColor" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--outline)"/>
    </marker>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--primary-container)"/>
      <stop offset="1" stop-color="var(--tertiary-container)"/>
    </linearGradient>
  </defs>
  <rect x="5" y="25" width="80" height="40" rx="20" fill="var(--secondary-container)"/>
  <text x="45" y="50" text-anchor="middle" fill="var(--on-secondary-container)">Ссылка</text>
  <rect x="110" y="25" width="80" height="40" rx="20" fill="var(--secondary-container)"/>
  <text x="150" y="50" text-anchor="middle" fill="var(--on-secondary-container)">Скачивание</text>
  <rect x="215" y="25" width="80" height="40" rx="20" fill="url(#accent)"/>
  <text x="255" y="50" text-anchor="middle" fill="var(--on-primary-container)">Проверка</text>
  <rect x="320" y="25" width="75" height="40" rx="20" fill="var(--primary)"/>
  <text x="357" y="50" text-anchor="middle" fill="var(--on-primary)">Установка</text>
  <g stroke="var(--outline)" stroke-width="2" marker-end="url(#arrow)">
    <line x1="85" y1="45" x2="108" y2="45"/>
    <line x1="190" y1="45" x2="213" y2="45"/>
    <line x1="295" y1="45" x2="318" y2="45"/>
  </g>
</svg>
