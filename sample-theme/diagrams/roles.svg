<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" fill="currentColor" font-family="sans-serif" font-size="14">
  <rect x="10" y="20" width="100" height="60" rx="16" fill="var(--primary)"/>
  <text x="60" y="55" text-anchor="middle" fill="var(--on-primary)">primary</text>
  <rect x="130" y="20" width="100" height="60" rx="16" fill="var(--secondary)"/>
  <text x="180" y="55" text-anchor="middle" fill="var(--on-secondary)">secondary</text>
  <rect x="250" y="20" width="100" height="60" rx="16" fill="var(--tertiary)"/>
  <text x="300" y="55" text-anchor="middle" fill="var(--on-tertiary)">tertiary</text>
</svg>
