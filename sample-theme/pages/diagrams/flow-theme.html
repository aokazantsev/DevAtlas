<h1>Путь темы в приложение</h1>
<p>Тема попадает в приложение за четыре шага.</p>
<img src="../../diagrams/theme-flow.svg" alt="Ссылка, скачивание, проверка, установка">
<ol>
  <li><b>Ссылка</b> — папка Яндекс.Диска, GitHub или zip-архив.</li>
  <li><b>Скачивание</b> — приложение получает zip.</li>
  <li><b>Проверка</b> — тот же валидатор, что и в <code>themecheck</code>.</li>
  <li><b>Установка</b> — тема распаковывается и открывается без сети.</li>
</ol>
