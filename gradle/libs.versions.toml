compose-material3 = "1.12.0-alpha03"
materialkolor = "5.0.1"
navigation = "2.10.0"
lifecycle = "2.11.0"
metro = "1.5.1"
room = "2.8.5"
sqlite = "2.7.1"
datastore = "1.3.0"
okio = "3.18.2"
ktor = "3.6.1"
coil = "3.6.3"
kotlinx-coroutines = "1.11.0"
